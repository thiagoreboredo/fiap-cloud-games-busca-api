trigger:
- main

pool: 'Default'

variables:
  imageRepository: 'fiap-cloud-games-busca-api'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  acrServiceConnection: 'ConexaoAzureContainerRegistry'

stages:
- stage: Build
  displayName: 'Build da Busca API'
  jobs:
  - job: BuildJob
    steps:
    - task: Docker@2
      displayName: 'Docker Build'
      inputs:
        command: 'build'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        dockerfile: '$(dockerfilePath)'
        tags: '$(tag)'

- stage: Push
  displayName: 'Push para ACR'
  dependsOn: Build
  jobs:
  - job: PushJob
    steps:
    - task: Docker@2
      displayName: 'Docker Push'
      inputs:
        command: 'push'
        containerRegistry: '$(acrServiceConnection)'
        repository: '$(imageRepository)'
        tags: '$(tag)'